name: Manual Build & Lint

on:
  workflow_dispatch:
    inputs:
      target:
        description: "What to run"
        default: "all"
        required: true
        type: choice
        options:
          - all
          - web
          - lint

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        if: inputs.target == 'all' || inputs.target == 'lint'
        run: npm run lint

      - name: Build
        if: inputs.target == 'all' || inputs.target == 'web'
        run: npm run build
