steps:
  # Build web container
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/workforce-web:$COMMIT_SHA', '-f', 'infra/docker/Dockerfile.web', '.']

  # Build agents container
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/workforce-agents:$COMMIT_SHA', '-f', 'infra/docker/Dockerfile.agents', '.']

  # Push web image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/workforce-web:$COMMIT_SHA']

  # Push agents image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/workforce-agents:$COMMIT_SHA']

  # Deploy web to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'workforce-web'
      - '--image=gcr.io/$PROJECT_ID/workforce-web:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=512Mi'

  # Deploy agents to GKE
  - name: 'gcr.io/cloud-builders/kubectl'
    args:
      - 'set'
      - 'image'
      - 'deployment/workforce-agents'
      - 'agents=gcr.io/$PROJECT_ID/workforce-agents:$COMMIT_SHA'
      - '--namespace=workforce'
    env:
      - 'CLOUDSDK_COMPUTE_ZONE=us-central1-a'
      - 'CLOUDSDK_CONTAINER_CLUSTER=workforce-cluster'

images:
  - 'gcr.io/$PROJECT_ID/workforce-web:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/workforce-agents:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
