apiVersion: apps/v1
kind: Deployment
metadata:
  name: workforce-agents
  namespace: workforce
  labels:
    app: workforce-agents
spec:
  replicas: 2
  selector:
    matchLabels:
      app: workforce-agents
  template:
    metadata:
      labels:
        app: workforce-agents
    spec:
      containers:
        - name: agents
          image: gcr.io/PROJECT_ID/workforce-agents:latest
          ports:
            - containerPort: 8080
          env:
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: workforce-secrets
                  key: google-api-key
            - name: GOOGLE_CLOUD_PROJECT
              value: "PROJECT_ID"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
